        custom: []
        name: status
        description: 'One of confirmed, shipped, delivered, cancelled.'
        required: true
        example: confirmed
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
