        custom: []
        status: 200
        content: '{"data": {"id": 1, "status": "confirmed", "total": "53.50", "items": [{"product_id": 6, "name": "Cotton T-Shirt", "unit_price": "12.00", "quantity": 2, "line_total": "24.00"}], "customer": {"id": 2, "name": "Test Customer", "email": "customer@store.test"}, "next_statuses": ["shipped", "cancelled"], "created_at": "2026-11-04T20:24:14+00:00", "updated_at": "2026-11-04T20:30:00+00:00"}}'
        headers: []
