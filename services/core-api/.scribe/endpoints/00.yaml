    responses:
      -
        custom: []
        status: 200
        content: '{"access_token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...", "token_type": "bearer", "expires_in": 3600, "user": {"id": 2, "name": "Test Customer", "email": "customer@store.test", "role": "customer", "created_at": "2026-11-04T10:00:00+00:00"}}'
        headers: []
        description: ''
