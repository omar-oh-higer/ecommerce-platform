name: Authentication
description: |-

  JWT authentication. Send the token as `Authorization: Bearer {token}`.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/register
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        JWT authentication. Send the token as `Authorization: Bearer {token}`.
      subgroup: ''
      subgroupDescription: ''
      title: Register
      description: |-
        Creates a **customer** account and logs it in. Sending `role` has no effect.
        Limited to 10 registrations per minute per IP.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: ''
        required: true
        example: Omar
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      email:
        custom: []
        name: email
        description: 'Must be unique.'
        required: true
        example: omar@example.com
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'At least 8 characters with letters and numbers.'
        required: true
        example: Secret123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password_confirmation:
        custom: []
        name: password_confirmation
        description: 'Same as password.'
        required: true
        example: Secret123
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: Omar
      email: omar@example.com
      password: Secret123
      password_confirmation: Secret123
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"access_token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...", "token_type": "bearer", "expires_in": 3600, "user": {"id": 3, "name": "Omar", "email": "omar@example.com", "role": "customer", "created_at": "2026-11-04T10:15:00+00:00"}}'
        headers: []
        description: Registered
      -
        custom: []
        status: 422
        content: '{"error": {"code": "VALIDATION_FAILED", "message": "The given data was invalid.", "details": {"email": ["The email has already been taken."], "password": ["The password field must be at least 8 characters."]}}}'
        headers: []
        description: 'Email taken / weak password'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/login
    metadata:
      custom: []
      groupName: Authentication
      groupDescription: |-

        JWT authentication. Send the token as `Authorization: Bearer {token}`.
      subgroup: ''
      subgroupDescription: ''
      title: Login
      description: |-
        Limited to **5 attempts per minute** for the same email and IP (then 429 with `Retry-After`).
        The error is the same whether the email exists or not.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      email:
        custom: []
        name: email
        description: ''
        required: true
        example: customer@store.test
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: ''
        required: true
        example: password
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      email: customer@store.test
      password: password
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"access_token": "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...", "token_type": "bearer", "expires_in": 3600, "user": {"id": 2, "name": "Test Customer", "email": "customer@store.test", "role": "customer", "created_at": "2026-11-04T10:00:00+00:00"}}'
        headers: []
        description: 'Logged in'
      -
        custom: []
        status: 401
        content: '{"error": {"code": "INVALID_CREDENTIALS", "message": "The email or password is incorrect.", "details": {}}}'
        headers: []
        description: 'Wrong email or password'
      -
        custom: []
        status: 429
        content: '{"error": {"code": "TOO_MANY_REQUESTS", "message": "Too Many Attempts.", "details": {}}}'
        headers: []
        description: 'Too many attempts'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
