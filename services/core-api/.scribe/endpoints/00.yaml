    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"data": {"id": 2, "name": "Test Customer", "email": "customer@store.test", "role": "customer", "created_at": "2026-11-04T10:00:00+00:00"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 401
        content: '{"error": {"code": "UNAUTHENTICATED", "message": "Authentication is required.", "details": {}}}'
        headers: []
        description: 'No or invalid token'
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
