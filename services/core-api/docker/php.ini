; Do not advertise the PHP version in responses (X-Powered-By).
expose_php = Off

; Product images up to 10 MB.
upload_max_filesize = 10M
post_max_size = 12M

memory_limit = 256M
max_execution_time = 30

; Errors go to the log, never to the response.
display_errors = Off
log_errors = On

date.timezone = UTC
