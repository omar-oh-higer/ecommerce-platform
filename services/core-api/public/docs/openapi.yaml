openapi: 3.0.3
info:
  title: 'E-Commerce Platform API — v1'
  description: 'REST API of the core application (Laravel). Damascus University — Internet Applications project 2026.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nJWT authentication. Send the token as `Authorization: Bearer {token}`."
  -
    name: Catalogue
    description: ''
  -
    name: Orders
    description: ''
  -
    name: Notifications
    description: ''
  -
    name: Administration
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a JWT from <code>POST /api/v1/auth/login</code> (field <code>access_token</code>) and send it as <code>Authorization: Bearer {token}</code>. Tokens expire after 60 minutes; use <code>POST /api/v1/auth/refresh</code>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: Register
      operationId: register
      description: "Creates a **customer** account and logs it in. Sending `role` has no effect.\nLimited to 10 registrations per minute per IP."
      parameters: []
      responses:
        201:
          description: Registered
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 3
                    name: Omar
                    email: omar@example.com
                    role: customer
                    created_at: '2026-11-04T10:15:00+00:00'
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 3
                      name:
                        type: string
                        example: Omar
                      email:
                        type: string
                        example: omar@example.com
                      role:
                        type: string
                        example: customer
                      created_at:
                        type: string
                        example: '2026-11-04T10:15:00+00:00'
        422:
          description: 'Email taken / weak password'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      email:
                        - 'The email has already been taken.'
                      password:
                        - 'The password field must be at least 8 characters.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email has already been taken.'
                            items:
                              type: string
                          password:
                            type: array
                            example:
                              - 'The password field must be at least 8 characters.'
                            items:
                              type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: Omar
                email:
                  type: string
                  description: 'Must be unique.'
                  example: omar@example.com
                password:
                  type: string
                  description: 'At least 8 characters with letters and numbers.'
                  example: Secret123
                password_confirmation:
                  type: string
                  description: 'Same as password.'
                  example: Secret123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: "Limited to **5 attempts per minute** for the same email and IP (then 429 with `Retry-After`).\nThe error is the same whether the email exists or not."
      parameters: []
      responses:
        200:
          description: 'Logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 2
                    name: 'Test Customer'
                    email: customer@store.test
                    role: customer
                    created_at: '2026-11-04T10:00:00+00:00'
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Test Customer'
                      email:
                        type: string
                        example: customer@store.test
                      role:
                        type: string
                        example: customer
                      created_at:
                        type: string
                        example: '2026-11-04T10:00:00+00:00'
        401:
          description: 'Wrong email or password'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: INVALID_CREDENTIALS
                    message: 'The email or password is incorrect.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVALID_CREDENTIALS
                      message:
                        type: string
                        example: 'The email or password is incorrect.'
                      details:
                        type: object
                        properties: {}
        429:
          description: 'Too many attempts'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: TOO_MANY_REQUESTS
                    message: 'Too Many Attempts.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: TOO_MANY_REQUESTS
                      message:
                        type: string
                        example: 'Too Many Attempts.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: customer@store.test
                password:
                  type: string
                  description: ''
                  example: password
              required:
                - email
                - password
      security: []
  /api/v1/auth/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 2
                    name: 'Test Customer'
                    email: customer@store.test
                    role: customer
                    created_at: '2026-11-04T10:00:00+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Test Customer'
                      email:
                        type: string
                        example: customer@store.test
                      role:
                        type: string
                        example: customer
                      created_at:
                        type: string
                        example: '2026-11-04T10:00:00+00:00'
        401:
          description: 'No or invalid token'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: UNAUTHENTICATED
                    message: 'Authentication is required.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHENTICATED
                      message:
                        type: string
                        example: 'Authentication is required.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh token'
      operationId: refreshToken
      description: 'Returns a new token. **The old token stops working immediately.**'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 2
                    name: 'Test Customer'
                    email: customer@store.test
                    role: customer
                    created_at: '2026-11-04T10:00:00+00:00'
                properties:
                  access_token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: 'Test Customer'
                      email:
                        type: string
                        example: customer@store.test
                      role:
                        type: string
                        example: customer
                      created_at:
                        type: string
                        example: '2026-11-04T10:00:00+00:00'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: UNAUTHENTICATED
                    message: 'Authentication is required.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHENTICATED
                      message:
                        type: string
                        example: 'Authentication is required.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'The current token is blacklisted: using it again returns 401.'
      parameters: []
      responses:
        204:
          description: 'Logged out'
          content:
            application/json:
              schema:
                type: object
                example: {}
                properties: {}
      tags:
        - Authentication
  /api/v1/categories:
    get:
      summary: 'List categories'
      operationId: listCategories
      description: 'Use `id` as `category_id` to filter products.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 2
                      name: Books
                      slug: books
                      products_count: 2
                    -
                      id: 3
                      name: Clothing
                      slug: clothing
                      products_count: 2
                    -
                      id: 1
                      name: Electronics
                      slug: electronics
                      products_count: 3
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 2
                        name: Books
                        slug: books
                        products_count: 2
                      -
                        id: 3
                        name: Clothing
                        slug: clothing
                        products_count: 2
                      -
                        id: 1
                        name: Electronics
                        slug: electronics
                        products_count: 3
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        name:
                          type: string
                          example: Books
                        slug:
                          type: string
                          example: books
                        products_count:
                          type: integer
                          example: 2
      tags:
        - Catalogue
      security: []
    post:
      summary: 'Create a category'
      operationId: createACategory
      description: '**Admin only.** The slug is generated from the name.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 4
                    name: 'Toys & Games'
                    slug: toys-games
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: 'Toys & Games'
                      slug:
                        type: string
                        example: toys-games
        403:
          description: 'Customer token'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: FORBIDDEN
                    message: 'This action is reserved for administrators.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: FORBIDDEN
                      message:
                        type: string
                        example: 'This action is reserved for administrators.'
                      details:
                        type: object
                        properties: {}
        422:
          description: 'Name taken'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      name:
                        - 'The name has already been taken.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          name:
                            type: array
                            example:
                              - 'The name has already been taken.'
                            items:
                              type: string
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Unique, up to 100 characters.'
                  example: 'Toys & Games'
              required:
                - name
  /api/v1/products:
    get:
      summary: 'List products'
      operationId: listProducts
      description: "Newest first, paginated. Stock is read from the inventory service in **one call for the whole page**.\nIf the inventory service is down the list still works and `stock.status` is `unavailable`."
      parameters:
        -
          in: query
          name: category_id
          description: 'Only products of this category.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Only products of this category.'
            example: 1
        -
          in: query
          name: search
          description: 'Search in the product name.'
          example: jacket
          required: false
          schema:
            type: string
            description: 'Search in the product name.'
            example: jacket
        -
          in: query
          name: per_page
          description: 'Between 1 and 50 (default 15).'
          example: 2
          required: false
          schema:
            type: integer
            description: 'Between 1 and 50 (default 15).'
            example: 2
        -
          in: query
          name: page
          description: 'Page number (default 1).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number (default 1).'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 7
                      name: 'Winter Jacket'
                      description: 'Water-resistant jacket with hood.'
                      price: '89.00'
                      image_url: null
                      category:
                        id: 3
                        name: Clothing
                        slug: clothing
                      stock:
                        quantity: 8
                        status: in_stock
                      created_at: '2026-11-04T19:50:03+00:00'
                    -
                      id: 6
                      name: 'Cotton T-Shirt'
                      description: '100% cotton, regular fit.'
                      price: '12.00'
                      image_url: null
                      category:
                        id: 3
                        name: Clothing
                        slug: clothing
                      stock:
                        quantity: 100
                        status: in_stock
                      created_at: '2026-11-04T19:50:03+00:00'
                  links:
                    first: 'http://localhost:8000/api/v1/products?per_page=2&page=1'
                    last: 'http://localhost:8000/api/v1/products?per_page=2&page=4'
                    prev: null
                    next: 'http://localhost:8000/api/v1/products?per_page=2&page=2'
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 4
                    path: 'http://localhost:8000/api/v1/products'
                    per_page: 2
                    to: 2
                    total: 8
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 7
                        name: 'Winter Jacket'
                        description: 'Water-resistant jacket with hood.'
                        price: '89.00'
                        image_url: null
                        category:
                          id: 3
                          name: Clothing
                          slug: clothing
                        stock:
                          quantity: 8
                          status: in_stock
                        created_at: '2026-11-04T19:50:03+00:00'
                      -
                        id: 6
                        name: 'Cotton T-Shirt'
                        description: '100% cotton, regular fit.'
                        price: '12.00'
                        image_url: null
                        category:
                          id: 3
                          name: Clothing
                          slug: clothing
                        stock:
                          quantity: 100
                          status: in_stock
                        created_at: '2026-11-04T19:50:03+00:00'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 7
                        name:
                          type: string
                          example: 'Winter Jacket'
                        description:
                          type: string
                          example: 'Water-resistant jacket with hood.'
                        price:
                          type: string
                          example: '89.00'
                        image_url:
                          type: string
                          example: null
                          nullable: true
                        category:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 3
                            name:
                              type: string
                              example: Clothing
                            slug:
                              type: string
                              example: clothing
                        stock:
                          type: object
                          properties:
                            quantity:
                              type: integer
                              example: 8
                            status:
                              type: string
                              example: in_stock
                        created_at:
                          type: string
                          example: '2026-11-04T19:50:03+00:00'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: 'http://localhost:8000/api/v1/products?per_page=2&page=1'
                      last:
                        type: string
                        example: 'http://localhost:8000/api/v1/products?per_page=2&page=4'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: 'http://localhost:8000/api/v1/products?per_page=2&page=2'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 4
                      path:
                        type: string
                        example: 'http://localhost:8000/api/v1/products'
                      per_page:
                        type: integer
                        example: 2
                      to:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 8
        422:
          description: 'Bad filters'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      per_page:
                        - 'The per page field must not be greater than 50.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          per_page:
                            type: array
                            example:
                              - 'The per page field must not be greater than 50.'
                            items:
                              type: string
      tags:
        - Catalogue
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                search:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 50.'
                  example: 7
                page:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
      security: []
    post:
      summary: 'Create a product'
      operationId: createAProduct
      description: "**Admin only.** `multipart/form-data` with the image. The initial quantity is sent to the inventory service;\nif that fails nothing is saved (no product row, no image) and 503 is returned."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 8
                    name: 'Gaming Mouse'
                    description: 'RGB mouse'
                    price: '25.50'
                    image_url: 'http://localhost:8000/storage/products/SizurDJW4OgLiAJsDCvmDcSQbpIPE0mdLif8Yjlh.png'
                    category:
                      id: 1
                      name: Electronics
                      slug: electronics
                    stock:
                      quantity: 5
                      status: in_stock
                    created_at: '2026-11-04T19:51:54+00:00'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 8
                      name:
                        type: string
                        example: 'Gaming Mouse'
                      description:
                        type: string
                        example: 'RGB mouse'
                      price:
                        type: string
                        example: '25.50'
                      image_url:
                        type: string
                        example: 'http://localhost:8000/storage/products/SizurDJW4OgLiAJsDCvmDcSQbpIPE0mdLif8Yjlh.png'
                      category:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: Electronics
                          slug:
                            type: string
                            example: electronics
                      stock:
                        type: object
                        properties:
                          quantity:
                            type: integer
                            example: 5
                          status:
                            type: string
                            example: in_stock
                      created_at:
                        type: string
                        example: '2026-11-04T19:51:54+00:00'
        403:
          description: 'Customer token'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: FORBIDDEN
                    message: 'This action is reserved for administrators.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: FORBIDDEN
                      message:
                        type: string
                        example: 'This action is reserved for administrators.'
                      details:
                        type: object
                        properties: {}
        422:
          description: 'Not an image'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: VALIDATION_FAILED
                    message: 'The given data was invalid.'
                    details:
                      image:
                        - 'The image field must be an image.'
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_FAILED
                      message:
                        type: string
                        example: 'The given data was invalid.'
                      details:
                        type: object
                        properties:
                          image:
                            type: array
                            example:
                              - 'The image field must be an image.'
                            items:
                              type: string
        503:
          description: 'Inventory service down'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: INVENTORY_UNAVAILABLE
                    message: 'The inventory service is not available right now. Please try again later.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVENTORY_UNAVAILABLE
                      message:
                        type: string
                        example: 'The inventory service is not available right now. Please try again later.'
                      details:
                        type: object
                        properties: {}
      tags:
        - Administration
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'An existing category.'
                  example: 1
                name:
                  type: string
                  description: ''
                  example: 'Gaming Mouse'
                description:
                  type: string
                  description: ''
                  example: 'RGB mouse'
                  nullable: true
                price:
                  type: number
                  description: 'Greater than 0, up to 2 decimals.'
                  example: 25.5
                image:
                  type: string
                  format: binary
                  description: 'jpg, jpeg, png or webp, max 2 MB. SVG is refused.'
                quantity:
                  type: integer
                  description: 'Initial stock (0 or more).'
                  example: 5
              required:
                - category_id
                - name
                - price
                - image
                - quantity
  '/api/v1/products/{id}':
    get:
      summary: 'Product details'
      operationId: productDetails
      description: "The quantity is asked from the inventory service at request time.\n`stock.status`: `in_stock`, `out_of_stock`, or `unavailable` (inventory service down, `quantity` is null)."
      parameters: []
      responses:
        200:
