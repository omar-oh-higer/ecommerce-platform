  '/api/v1/orders/{order_id}/status':
    patch:
      summary: 'Change order status'
      operationId: changeOrderStatus
      description: "**Admin only** (a customer gets 403, even on their own order).\nAllowed: pending → confirmed | cancelled, confirmed → shipped | cancelled, shipped → delivered.\nCancelling gives the stock back to the inventory service. The customer is notified.\nCancelling **always succeeds**, even when the inventory service is down: the response then has\n`stock_return: \"pending\"` and a background job returns the stock as soon as the service is back\n(`stock_return` becomes `\"done\"`)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: Confirmed
                    type: object
                    example:
                      data:
                        id: 1
                        status: confirmed
                        total: '53.50'
                        items:
                          -
                            product_id: 6
                            name: 'Cotton T-Shirt'
                            unit_price: '12.00'
                            quantity: 2
                            line_total: '24.00'
                        customer:
                          id: 2
                          name: 'Test Customer'
                          email: customer@store.test
                        next_statuses:
                          - shipped
                          - cancelled
                        created_at: '2026-11-04T20:24:14+00:00'
                        updated_at: '2026-11-04T20:30:00+00:00'
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          status:
                            type: string
                            example: confirmed
                          total:
                            type: string
                            example: '53.50'
                          items:
                            type: array
                            example:
                              -
                                product_id: 6
                                name: 'Cotton T-Shirt'
                                unit_price: '12.00'
                                quantity: 2
                                line_total: '24.00'
                            items:
                              type: object
                              properties:
                                product_id:
                                  type: integer
                                  example: 6
                                name:
                                  type: string
                                  example: 'Cotton T-Shirt'
                                unit_price:
                                  type: string
                                  example: '12.00'
                                quantity:
                                  type: integer
                                  example: 2
                                line_total:
                                  type: string
                                  example: '24.00'
                          customer:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 2
                              name:
                                type: string
                                example: 'Test Customer'
                              email:
                                type: string
                                example: customer@store.test
                          next_statuses:
                            type: array
                            example:
                              - shipped
                              - cancelled
                            items:
                              type: string
                          created_at:
                            type: string
                            example: '2026-11-04T20:24:14+00:00'
                          updated_at:
                            type: string
                            example: '2026-11-04T20:30:00+00:00'
                  -
                    description: 'Cancelled while the inventory service is down'
                    type: object
                    example:
                      data:
                        id: 13
                        status: cancelled
                        total: '36.00'
                        items:
                          -
                            product_id: 6
                            name: 'Cotton T-Shirt'
                            unit_price: '12.00'
                            quantity: 3
                            line_total: '36.00'
                        customer:
                          id: 11
                          name: 'Test Customer'
                          email: customer@store.test
                        stock_return: pending
                        next_statuses: []
                        created_at: '2026-11-05T10:27:12+00:00'
                        updated_at: '2026-11-05T10:27:15+00:00'
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 13
                          status:
                            type: string
                            example: cancelled
                          total:
                            type: string
                            example: '36.00'
                          items:
                            type: array
                            example:
                              -
                                product_id: 6
                                name: 'Cotton T-Shirt'
                                unit_price: '12.00'
                                quantity: 3
                                line_total: '36.00'
                            items:
                              type: object
                              properties:
                                product_id:
                                  type: integer
                                  example: 6
                                name:
                                  type: string
                                  example: 'Cotton T-Shirt'
                                unit_price:
                                  type: string
                                  example: '12.00'
                                quantity:
                                  type: integer
                                  example: 3
                                line_total:
                                  type: string
                                  example: '36.00'
                          customer:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 11
                              name:
                                type: string
                                example: 'Test Customer'
                              email:
                                type: string
                                example: customer@store.test
                          stock_return:
                            type: string
                            example: pending
                          next_statuses:
                            type: array
                            example: []
                          created_at:
                            type: string
                            example: '2026-11-05T10:27:12+00:00'
                          updated_at:
                            type: string
                            example: '2026-11-05T10:27:15+00:00'
        403:
          description: 'Customer token'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: FORBIDDEN
                    message: 'This action is reserved for administrators.'
                    details: {}
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: FORBIDDEN
                      message:
                        type: string
                        example: 'This action is reserved for administrators.'
                      details:
                        type: object
                        properties: {}
        409:
          description: 'Transition not allowed'
          content:
            application/json:
              schema:
                type: object
                example:
                  error:
                    code: INVALID_STATUS_TRANSITION
                    message: "An order cannot move from 'delivered' to 'cancelled'."
                    details:
                      current: delivered
                      allowed: []
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INVALID_STATUS_TRANSITION
                      message:
                        type: string
                        example: "An order cannot move from 'delivered' to 'cancelled'."
                      details:
                        type: object
                        properties:
                          current:
                            type: string
                            example: delivered
                          allowed:
                            type: array
                            example: []
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'One of confirmed, shipped, delivered, cancelled.'
                  example: confirmed
              required:
                - status
    parameters:
      -
        in: path
        name: order_id
        description: 'The ID of the order.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: order
        description: 'The order id.'
        example: 1
        required: true
        schema:
          type: integer
