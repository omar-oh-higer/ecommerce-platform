  /api/v1/orders:
    post:
      summary: 'Place an order'
      operationId: placeAnOrder
      description: "One call to the inventory service reserves **every** item (all or nothing).\nPrices always come from the database: any price sent by the client is ignored.\nIf saving the order fails after the reservation, the stock is given back.\nLimited to 10 orders per minute per user."
