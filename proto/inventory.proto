syntax = "proto3";

package inventory.v1;

option csharp_namespace = "InventoryService.Grpc";
option php_namespace = "App\\Grpc\\Inventory";
option php_metadata_namespace = "App\\Grpc\\GPBMetadata";

// Inventory service contract.
// Client: core-api (Laravel). Server: inventory-service (.NET).
// The core app never touches the inventory database; it only talks through this contract.
service Inventory {
  // 1) Get quantity: how many units of this product are left?
  rpc GetStock (GetStockRequest) returns (StockReply);

  // Same as GetStock for many products in one call (product listing pages).
  rpc GetStockBatch (GetStockBatchRequest) returns (GetStockBatchReply);

  // 2) Reserve quantity: one call reserves ALL items of an order (all or nothing).
  //    Idempotent per reservation_id: repeating the call never deducts twice.
  rpc ReserveStock (ReserveStockRequest) returns (ReserveStockReply);

  // 3) Release quantity: give back what was reserved if the order fails or is cancelled.
  //    Idempotent per reservation_id: releasing twice returns the stock only once.
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockReply);

  // Admin inventory management: set the absolute quantity of a product.
  rpc SetStock (SetStockRequest) returns (StockReply);
}

message GetStockRequest {
  int64 product_id = 1;
}

message GetStockBatchRequest {
  repeated int64 product_ids = 1;
}

message GetStockBatchReply {
  repeated StockReply items = 1;
}

message StockReply {
  int64 product_id = 1;
  int32 quantity = 2;  // units available for sale
}

message StockItem {
  int64 product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string reservation_id = 1;     // UUID generated by core-api before calling
  repeated StockItem items = 2;
}

message ReserveStockReply {
  bool success = 1;
  string message = 2;
  // When success = false: items whose stock is not enough (quantity = what is available now).
  repeated StockItem unavailable_items = 3;
}

message ReleaseStockRequest {
  string reservation_id = 1;
}

message ReleaseStockReply {
  bool success = 1;
  string message = 2;
}

message SetStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}
