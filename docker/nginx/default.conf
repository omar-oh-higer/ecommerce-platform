server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    # index.html serves the generated API docs at /docs/
    index index.html index.php;

    # Hide the nginx version.
    server_tokens off;

    # Product images up to 10 MB (matches php.ini).
    client_max_body_size 12M;

    charset utf-8;

    # Docker's internal DNS. With a variable in fastcgi_pass nginx looks the name up again
    # (every 10 s) instead of only at start-up, so `docker compose restart core-api`
    # (new container IP) does not leave nginx answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core_api core-api:9000;

    # Uploaded files (product images), served directly by nginx.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        add_header X-Content-Type-Options nosniff;
        expires 7d;
        try_files $uri =404;
    }

    # API documentation (generated by `php artisan scribe:generate` into public/docs).
    location = /docs {
        return 301 /docs/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $core_api;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Never serve hidden files such as .env or .git.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
