# Distributed Real-Time E-Commerce Platform — local environment.
#
#   docker compose up -d --build     start everything
#   docker compose logs -f core-api  follow the app logs
#   docker compose down              stop (data is kept)
#   docker compose down -v           stop and delete the database

name: ecommerce-platform

services:
  # Entry point: http://localhost:8000
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./services/core-api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core-api:
        condition: service_healthy
    restart: unless-stopped

  # Laravel application (PHP-FPM)
  core-api:
    build:
      context: ./services/core-api
    volumes:
      - ./services/core-api:/var/www/html
    environment: &core-api-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8000}
      APP_PORT: ${APP_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: secret
      LOG_CHANNEL: stderr
      # Until the .NET service is connected the app uses a built-in fake inventory.
      # Demo "inventory is down":  INVENTORY_FAKE_DOWN=true docker compose up -d
      INVENTORY_DRIVER: ${INVENTORY_DRIVER:-fake}
      INVENTORY_FAKE_DOWN: ${INVENTORY_FAKE_DOWN:-false}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Healthy once the entrypoint finished and php-fpm is listening.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s
    restart: unless-stopped

  # Background jobs (e.g. retrying a stock release when the inventory service was down).
  # Same image and code as core-api; starts once core-api has prepared the app.
  # After `git pull` run: docker compose up -d --build --force-recreate
  # (core-api applies new migrations on start; the worker must reload the code).
  queue-worker:
    build:
      context: ./services/core-api
    command: ["php", "artisan", "queue:work", "--sleep=3", "--max-time=3600"]
    volumes:
      - ./services/core-api:/var/www/html
    environment:
      <<: *core-api-env
      CONTAINER_ROLE: worker
    depends_on:
      core-api:
        condition: service_healthy
    restart: unless-stopped

  # Application database
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root-secret
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot-secret --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Inventory service (requirement 2): a separate .NET 10 gRPC service with its
  # own PostgreSQL database. core-api only reaches it through proto/inventory.proto.
  # ---------------------------------------------------------------------------
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      ConnectionStrings__Inventory: Host=inventory-db;Port=5432;Database=inventory;Username=inventory;Password=secret
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # Exposed for testing with grpcurl / Postman from the host.
      - "${INVENTORY_GRPC_PORT:-5001}:5001"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Inventory database (PostgreSQL) — used only by inventory-service.
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: secret
    ports:
      - "${INVENTORY_DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  mysql-data:
  inventory-data:
